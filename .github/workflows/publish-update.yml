name: Publish update canal

# Publica o receiver + manifest no canal público (pianolouvorja/palco-updates,
# servido por GitHub Pages) quando uma tag v* sai da main.
# As TVs com updater (>= 0.1.43) buscam esse canal e se atualizam sozinhas.
# Repo de artefato: nenhum humano pusha direto — só este job (flow da org:
# feat -> staging -> main -> tag -> canal).

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    name: Publicar HTML + manifest no palco-updates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout palco-receiver
        uses: actions/checkout@v5

      - name: Extrair versão
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Validar versão semver
        run: |
          V="${GITHUB_REF_NAME#v}"
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$V' não é X.Y.Z limpo — o updater da TV só compara números"
            exit 1
          fi

      - name: Sanity versoes iguais
        run: |
          V="${GITHUB_REF_NAME#v}"
          APPINFO=$(node -p "require('./webos/appinfo.json').version")
          HTML=$(grep -o "window.__PALCO_APPV__||'[0-9.]*'" webos/index.html | head -1 | grep -o "[0-9]*\.[0-9]*\.[0-9]*")
          echo "tag=$V appinfo=$APPINFO html=$HTML"
          if [ "$APPINFO" != "$V" ] || [ "$HTML" != "$V" ]; then
            echo "::error::Versões divergentes — bump esquecido (HTML hardcode e appinfo.json devem bater com a tag)"
            exit 1
          fi

      - name: Checkout palco-updates gh-pages
        uses: actions/checkout@v5
        with:
          repository: pianolouvorja/palco-updates
          ref: gh-pages
          token: ${{ secrets.PALCO_UPDATES_TOKEN }}
          path: palco-updates

      - name: Publicar versao
        run: |
          V="${GITHUB_REF_NAME#v}"
          cd palco-updates
          mkdir -p "$V"
          cp ../webos/index.html "$V/index.html"
          for f in bg-fallback.png splash-palco.jpg splash-palco.png logo-piano-louvorja.png logo-louvor-ja.svg; do
            if [ -f "../webos/$f" ]; then cp "../webos/$f" "$V/"; fi
          done
          printf '{\n  "version": "%s",\n  "html": "%s/index.html"\n}\n' "$V" "$V" > manifest.json
          git config user.name "palco-ci"
          git config user.email "ci@pianolouvorja"
          git add -A
          if git diff --cached --quiet; then
            echo "Nada mudou — skip commit"
          else
            git commit -m "release: receiver $V (tag ${GITHUB_REF_NAME} do palco-receiver)"
            git push
          fi

      - name: Verificar propagacao no Pages
        run: |
          V="${GITHUB_REF_NAME#v}"
          sleep 30
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://pianolouvorja.github.io/palco-updates/$V/index.html")
            echo "tentativa $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then exit 0; fi
            sleep 30
          done
          echo "::warning::Pages não propagou em 3min — conferir manualmente"
