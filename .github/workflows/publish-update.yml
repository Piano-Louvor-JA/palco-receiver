name: Publish update canal

# Publica o receiver + manifest no canal público (Piano-Louvor-JA/palco-updates,
# servido por GitHub Pages) quando uma tag v* sai da main.
# Repo de artefato: nenhum humano pusha direto — só este job (flow da org:
# feat -> staging -> main -> tag -> canal).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag vX.Y.Z existente na main para retomar a publicação'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: palco-publish-update
  cancel-in-progress: false

jobs:
  publish:
    name: Publicar HTML + manifest no palco-updates
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Checkout palco-receiver
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validar tag e preservar validador da publicação
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != refs/heads/main ]]; then
            echo '::error::A retomada deve usar o workflow da main.'
            exit 1
          fi
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::A tag de publicação deve ser vX.Y.Z.'
            exit 1
          fi
          RELEASE_SHA=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          cp scripts/validate-release-version.mjs "$RUNNER_TEMP/palco-validate-release-version.mjs"

      - name: Checkout da tag existente para retomada
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}

      - name: Sanity versoes iguais
        run: node "$RUNNER_TEMP/palco-validate-release-version.mjs" "$RELEASE_TAG"

      - name: Configurar identidade de parceiro do Palco
        env:
          PARTNER_KEY_STG: ${{ secrets.PARTNER_KEY_STG }}
          PARTNER_KEY_PROD: ${{ secrets.PARTNER_KEY_PROD }}
        run: node scripts/configure-partner-key.mjs

      - name: Checkout palco-updates gh-pages
        uses: actions/checkout@v7
        with:
          repository: Piano-Louvor-JA/palco-updates
          ref: gh-pages
          token: ${{ secrets.PALCO_UPDATES_TOKEN }}
          path: palco-updates

      - name: Publicar versao
        run: |
          V="${RELEASE_TAG#v}"
          cd palco-updates
          mkdir -p "$V"
          cp ../webos/index.html "$V/index.html"
          for f in i18n.js network-mirror.js bg-fallback.png splash.jpg splash-palco.jpg splash-palco.png logo-piano-louvorja.png logo-louvor-ja.svg; do
            if [ -f "../webos/$f" ]; then cp "../webos/$f" "$V/"; fi
          done
          printf '{\n  "version": "%s",\n  "html": "%s/index.html"\n}\n' "$V" "$V" > manifest.json
          git config user.name "palco-ci"
          git config user.email "ci@pianolouvorja"
          git add -A
          if git diff --cached --quiet; then
            echo "Nada mudou — skip commit"
          else
            git commit -m "release: receiver $V (tag ${RELEASE_TAG} do palco-receiver)"
            git push
          fi

      - name: Verificar propagacao no Pages
        run: |
          V="${RELEASE_TAG#v}"
          sleep 30
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://piano-louvor-ja.github.io/palco-updates/$V/index.html")
            echo "tentativa $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then exit 0; fi
            sleep 30
          done
          echo "::warning::Pages não propagou em 3min — conferir manualmente"
