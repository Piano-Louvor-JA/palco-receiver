# Security jobs — só gitleaks (este repo não tem npm).
# Bloqueia PR e push em staging/main com segredo no diff ou no histórico.
name: security
on:
  pull_request:
  push:
    branches: [staging, main]

jobs:
  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # CLI open source. A action oficial (gitleaks-action@v2) passou a exigir
      # licença paga (GITLEAKS_LICENSE) e quebrava todo PR de organização.
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz -C "$RUNNER_TEMP"
      - name: Scan
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            "$RUNNER_TEMP/gitleaks" detect --source . --redact --log-opts="${{ github.event.pull_request.base.sha }}..HEAD"
          else
            "$RUNNER_TEMP/gitleaks" detect --source . --redact
          fi
