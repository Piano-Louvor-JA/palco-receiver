name: CI/CD

on:
  push:
    branches: [main, staging]
    tags: ['v*', 'webos-v*', 'androidtv-v*', 'tizen-v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# contents:write necessario APENAS nos jobs de package (release upload).
# validate e lint rodam read-only.
permissions:
  contents: read

jobs:
  validate:
    name: Validate receiver
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Paridade receiver (webos vs androidtv)
        run: |
          if ! diff -q webos/index.html androidtv/assets/palco/receiver.html; then
            echo "::error::receiver divergente entre webos/ e androidtv/ — sincronize antes do merge"
            exit 1
          fi
          echo "Paridade OK"

      - name: Lint ES2020 proibido no receiver
        run: |
          # root cause 0.1.3: nullish coalescing quebra o PARSE no Chromium webOS
          SCRIPT=$(node -e "
            const s = require('fs').readFileSync('webos/index.html','utf8');
            const m = s.match(/<script>([\s\S]*?)<\/script>/);
            process.stdout.write(m ? m[1] : '');
          ")
          if echo "$SCRIPT" | grep -nE '\?\?|\?\.[a-zA-Z]'; then
            echo "::error::ES2020+ encontrado — o Chromium do webOS não parseia e o script inteiro morre"
            exit 1
          fi
          echo "Sem ES2020+ OK"
          echo "$SCRIPT" > /tmp/r.js
          node --check /tmp/r.js && echo "Sintaxe OK"

      - name: Valida appinfo.json
        run: |
          node -e "
          const info = require('./webos/appinfo.json');
          const required = ['id','version','type','main','title','icon','largeIcon'];
          const missing = required.filter(k => !info[k]);
          if (missing.length) { console.error('Missing:', missing); process.exit(1); }
          if (!/^\d+\.\d+\.\d+$/.test(info.version)) { console.error('version must be semver X.Y.Z'); process.exit(1); }
          if (!info.id.includes('.')) { console.error('id must be FQDN-like'); process.exit(1); }
          console.log('appinfo OK:', info.id, info.version);
          "

      - name: Lint seguranca (LG QA)
        run: |
          # Procura credencial LITERAL (token='valor' / token: 'valor'). Concatenação
          # de variável (token='+var) não é credencial hardcoded — é uso legítimo.
          if grep -rniE "(passwd|password|pwd|token|credential|secret)\s*[:=]\s*['\"][^'\"]{4,}['\"]" webos/index.html | grep -vE "\+encodeURIComponent|\+.*\+"; then
            echo "::error::Hardcoded credential pattern found — LG QA rejects this"
            exit 1
          fi
          echo "No credential patterns OK"

      - name: Valida pubspec androidtv
        run: |
          VERSION=$(grep '^version:' androidtv/pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::pubspec version invalida: $VERSION"; exit 1
          fi
          echo "pubspec OK: $VERSION"

  webos-package:
    name: webOS IPK
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install webOS CLI
        run: npm install -g @webos-tools/cli

      - name: Package ipk
        run: |
          cd webos
          ares-package --no-minify --no-app-sign .
          IPK=$(ls *.ipk)
          echo "IPK_FILE=$IPK" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPK_FILE }}
          path: webos/*.ipk

      - name: Attach to release (tags)
        if: startsWith(github.ref, 'refs/tags/webos-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: webos/*.ipk

  androidtv-package:
    name: Android TV APK
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        working-directory: androidtv
        run: flutter pub get

      - name: Analyze
        working-directory: androidtv
        run: flutter analyze --no-fatal-infos

      - name: Build APK release
        working-directory: androidtv
        run: |
          flutter build apk --release
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/PalcoLouvorJA-AndroidTV-${VERSION}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PalcoLouvorJA-AndroidTV
          path: androidtv/build/app/outputs/flutter-apk/PalcoLouvorJA-AndroidTV-*.apk

      - name: Attach to release (tags)
        if: startsWith(github.ref, 'refs/tags/androidtv-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: androidtv/build/app/outputs/flutter-apk/PalcoLouvorJA-AndroidTV-*.apk

  tizen-package:
    name: Tizen WGT
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Paridade receiver (webos vs tizen)
        run: |
          if ! diff -q webos/index.html tizen/index.html; then
            echo "::error::receiver divergente webos/ vs tizen/ — sincronize"
            exit 1
          fi

      - name: Valida config.xml
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          t = ET.parse('tizen/config.xml')
          r = t.getroot()
          assert r.tag.endswith('widget'), 'root widget'
          ns = '{http://tizen.org/ns/widgets}'
          app = r.find(f'{ns}application')
          assert app is not None and app.get('id') == 'com.piano.louvorja.palco'
          print('config.xml OK:', app.get('id'))
          "

      - name: Empacota wgt
        run: |
          VERSION=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('tizen/config.xml').getroot().get('version'))")
          cd tizen
          zip -qr "../com.piano.louvorja.palco_${VERSION}.wgt" index.html config.xml logo-piano-louvorja.png logo-louvor-ja.svg bg-fallback.png

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: palco-tizen-wgt
          path: com.piano.louvorja.palco_*.wgt

      - name: Attach to release (tags)
        if: startsWith(github.ref, 'refs/tags/tizen-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: com.piano.louvorja.palco_*.wgt
